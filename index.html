<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Huni"/>
<meta name="theme-color" content="#0a0812"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet"/>
<title>Huni</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0812}
#app{width:100vw;height:100vh;height:100dvh;overflow:hidden;position:relative}
.cinzel{font-family:'Cinzel',serif}
.corra{font-family:'Cormorant Garamond',serif;font-style:italic}
.nunito{font-family:'Nunito',sans-serif}
input,select,textarea,button{font-family:'Nunito',sans-serif;font-size:13px}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
.screen{position:absolute;inset:0;width:100%;height:100%}
.panel-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 100px;height:calc(100% - 70px)}
.pill-in{border-radius:20px;padding:8px 14px;outline:none;width:100%}
.pill-sel{border-radius:20px;padding:8px 12px;outline:none;cursor:pointer}
.node-circle{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 10px var(--glow)}50%{box-shadow:0 0 28px var(--glow),0 0 50px var(--glow)}}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.9}}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 8px))}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease both}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Data ──────────────────────────────────────────────────────
const WORLDS={
  work:{label:"Work",menu:"WORK",sub:"agency · clients · strategy",
    p:{bg:"#110d1e",card:"rgba(201,184,232,.09)",accent:"#C9B8E8",pill:"rgba(201,184,232,.14)",pillT:"#EDE8FF",border:"rgba(201,184,232,.28)",dim:"rgba(201,184,232,.48)",glow:"rgba(201,184,232,.45)"},
    clients:["Toyota of Corona","House of Imports","Agency"],
    types:["Reel","Carousel","Story","Static","TikTok"],
    nodes:[{id:"tasks",label:"Tasks",x:50,y:30},{id:"content",label:"Content",x:22,y:64},{id:"habits",label:"Habits",x:78,y:64}]},
  creative:{label:"Creative",menu:"CREATIVE",sub:"music · writing · hunniedontcry",
    p:{bg:"#0c1a12",card:"rgba(123,175,144,.09)",accent:"#7BAF90",pill:"rgba(123,175,144,.14)",pillT:"#E8F5EE",border:"rgba(123,175,144,.28)",dim:"rgba(123,175,144,.48)",glow:"rgba(123,175,144,.45)"},
    clients:["Music","hunniedontcry","Writing","Photography"],
    types:["Song","Blog","Think piece","Visual"],
    nodes:[{id:"tasks",label:"Tasks",x:50,y:30},{id:"content",label:"Content",x:22,y:64},{id:"habits",label:"Habits",x:78,y:64}]},
  siya:{label:"Siya",menu:"SIYA",sub:"jewelry · brand · clients",
    p:{bg:"#18140a",card:"rgba(212,192,100,.09)",accent:"#D4C064",pill:"rgba(212,192,100,.14)",pillT:"#FFF8E0",border:"rgba(212,192,100,.28)",dim:"rgba(212,192,100,.48)",glow:"rgba(212,192,100,.45)"},
    clients:["SIYA","Wholesale","Custom orders","Events"],
    types:["Product drop","Story","Reel","Campaign"],
    nodes:[{id:"tasks",label:"Tasks",x:50,y:30},{id:"content",label:"Content",x:22,y:64},{id:"habits",label:"Habits",x:78,y:64}]},
  personal:{label:"Personal",menu:"PERSONAL",sub:"ritual · growth · life",
    p:{bg:"#0c1220",card:"rgba(159,168,200,.09)",accent:"#9FA8C8",pill:"rgba(159,168,200,.14)",pillT:"#EEF0FF",border:"rgba(159,168,200,.28)",dim:"rgba(159,168,200,.48)",glow:"rgba(159,168,200,.45)"},
    clients:["Ritual","Health","Finance","Travel"],
    types:["Practice","Goal","Intention","Note"],
    nodes:[{id:"tasks",label:"Tasks",x:50,y:30},{id:"content",label:"Content",x:22,y:64},{id:"habits",label:"Habits",x:78,y:64}]}
};
const STATUSES=["draft","scheduled","live","needs_edit"];
const SCOL={draft:"#9A8EC0",scheduled:"#7B6BAA",live:"#7BAF90",needs_edit:"#C97070"};
const DAYS=["M","T","W","T","F","S","S"];
const uid=()=>Math.random().toString(36).slice(2,9);
const toDay=()=>new Date().toISOString().slice(0,10);

// ── Storage (localStorage) ─────────────────────────────────────
const sto={
  get(k){try{const v=localStorage.getItem("huni_"+k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem("huni_"+k,JSON.stringify(v))}catch{}}
};

// ── State ──────────────────────────────────────────────────────
let S={
  view:"landing",world:null,sub:null,
  tasks:sto.get("tasks")||{},
  posts:sto.get("posts")||{},
  habits:sto.get("habits")||{},
  hlog:sto.get("hlog")||{},
  filter:"all",showForm:false
};
function set(patch){Object.assign(S,patch);sto.set("tasks",S.tasks);sto.set("posts",S.posts);sto.set("habits",S.habits);sto.set("hlog",S.hlog);render()}

// ── Helpers ────────────────────────────────────────────────────
function wTasks(){return S.tasks[S.world]||[]}
function wPosts(){return S.posts[S.world]||[]}
function wHabits(){return S.habits[S.world]||[]}
function mutTasks(fn){const t={...S.tasks};t[S.world]=fn(t[S.world]||[]);set({tasks:t})}
function mutPosts(fn){const p={...S.posts};p[S.world]=fn(p[S.world]||[]);set({posts:p})}
function mutHabits(fn){const h={...S.habits};h[S.world]=fn(h[S.world]||[]);set({habits:h})}
function dayStr(off){const dt=new Date(),d=dt.getDay(),m=new Date(dt);m.setDate(dt.getDate()-((d+6)%7)+off);return m.toISOString().slice(0,10)}
function hChecked(hid,off){return!!(S.hlog[S.world+"_"+hid+"_"+dayStr(off)])}
function hStreak(hid){let c=0,o=0;const dt=new Date();while(o<365){const d=new Date(dt);d.setDate(dt.getDate()-o);if(S.hlog[S.world+"_"+hid+"_"+d.toISOString().slice(0,10)]){c++;o++}else break}return c}

// ── Stars ──────────────────────────────────────────────────────
const STARS=[...Array(70)].map(()=>({x:Math.random()*100,y:Math.random()*100,r:Math.random()*1.6+.4,d:Math.random()*3+1.5,dl:Math.random()*4}));
function starsSVG(color="white",opacity=.35){
  return`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" xmlns="http://www.w3.org/2000/svg">`+
    STARS.map(s=>`<circle cx="${s.x}%" cy="${s.y}%" r="${s.r}" fill="${color}" opacity="${opacity}" style="animation:shimmer ${s.d}s ${s.dl}s ease-in-out infinite"/>`).join("")+
  `</svg>`}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  if(S.view==="landing"){app.innerHTML=renderLanding();bindLanding();}
  else if(S.view==="world"&&!S.sub){app.innerHTML=renderMap();bindMap();}
  else if(S.view==="world"&&S.sub){app.innerHTML=renderPanel();bindPanel();}
}

// ── LANDING ────────────────────────────────────────────────────
function renderLanding(){
  const menu=Object.entries(WORLDS).map(([wk,w],i)=>
    `<button class="cinzel menu-item" data-w="${wk}" style="display:block;text-align:right;font-size:clamp(20px,5.5vw,38px);color:rgba(245,240,255,.65);letter-spacing:3px;line-height:1.2;padding:2px 0;text-shadow:0 0 18px rgba(201,184,232,.25);transition:color .2s,text-shadow .2s;animation:fadeUp .4s ${i*.09}s both">${w.menu}</button>`
  ).join("");
  return`<div class="screen" style="background:#0a0812;overflow:hidden">
    ${starsSVG()}
    <div style="position:absolute;top:7%;left:0;right:0;text-align:center;padding:0 20px">
      <div class="cinzel" style="font-size:clamp(11px,3.5vw,16px);color:rgba(201,184,232,.5);letter-spacing:6px;margin-bottom:6px">THE</div>
      <div class="cinzel" style="font-size:clamp(36px,11vw,84px);color:#F5F0FF;line-height:.95;text-shadow:0 0 50px rgba(201,184,232,.5)">Art of</div>
      <div class="cinzel" style="font-size:clamp(30px,9.5vw,72px);color:#C9B8E8;line-height:1.05;text-shadow:0 0 70px rgba(201,184,232,.7)">Productivity</div>
      <div class="corra" style="font-size:clamp(13px,3vw,18px);color:rgba(201,184,232,.38);margin-top:12px;letter-spacing:2px">a personal archive</div>
    </div>
    <div style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(201,184,232,.07) 0%,transparent 70%);border:.5px solid rgba(201,184,232,.1);animation:float 6s ease-in-out infinite;pointer-events:none"></div>
    <div style="position:absolute;bottom:6%;right:6%;display:flex;flex-direction:column;align-items:flex-end;gap:4px">${menu}</div>
    <div class="nunito" style="position:absolute;bottom:4%;left:5%;font-size:9px;color:rgba(201,184,232,.25);letter-spacing:2px">SELECT A WORLD</div>
  </div>`}
function bindLanding(){
  document.querySelectorAll(".menu-item").forEach(el=>{
    el.addEventListener("pointerenter",()=>{el.style.color="#F5F0FF";el.style.textShadow="0 0 30px rgba(201,184,232,.8)"});
    el.addEventListener("pointerleave",()=>{el.style.color="rgba(245,240,255,.65)";el.style.textShadow="0 0 18px rgba(201,184,232,.25)"});
    el.addEventListener("click",()=>set({view:"world",world:el.dataset.w,sub:null,filter:"all",showForm:false}));
  });
}

// ── WORLD MAP ──────────────────────────────────────────────────
function renderMap(){
  const w=WORLDS[S.world],p=w.p;
  const t=wTasks(),po=wPosts(),h=wHabits();
  const done=t.filter(x=>x.done).length;
  const counts={tasks:t.length,content:po.length,habits:h.length};
  const cx=50,cy=46;
  const lines=w.nodes.map(n=>`<line x1="${cx}%" y1="${cy}%" x2="${n.x}%" y2="${n.y}%" stroke="${p.accent}" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 7"/>`).join("");
  const nodes=w.nodes.map(n=>{
    const cnt=counts[n.id];
    const extra=n.id==="tasks"?` (${done} done)`:"";
    return`<button class="node-circle" data-n="${n.id}" style="position:absolute;left:${n.x}%;top:${n.y}%;transform:translate(-50%,-50%);width:72px;height:72px;--glow:${p.glow};border:1.5px solid ${p.accent};background:radial-gradient(circle,${p.glow} 0%,transparent 70%);animation:pulse 3s ease-in-out infinite;cursor:pointer;flex-direction:column;gap:2px">
      <span class="cinzel" style="font-size:9px;color:${p.accent};letter-spacing:1px;line-height:1.2;text-align:center">${n.label}</span>
      <span class="nunito" style="font-size:8px;color:${p.dim}">${cnt}${extra}</span>
    </button>`}).join("");
  return`<div class="screen" style="background:${p.bg};overflow:hidden">
    ${starsSVG(p.accent,.2)}
    <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" xmlns="http://www.w3.org/2000/svg">${lines}</svg>
    <button id="btn-back" class="nunito" style="position:absolute;top:20px;left:18px;border:.5px solid ${p.border};color:${p.dim};padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:2px;z-index:10">← ARCHIVE</button>
    <div style="position:absolute;top:${cy}%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;pointer-events:none">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,${p.glow} 0%,transparent 65%);opacity:.3"></div>
      <div class="cinzel" style="position:relative;font-size:clamp(30px,9vw,60px);color:${p.accent};text-shadow:0 0 40px ${p.glow};letter-spacing:2px">${w.label}</div>
      <div class="corra" style="position:relative;font-size:clamp(12px,3vw,16px);color:${p.dim};margin-top:6px;letter-spacing:1px">${w.sub}</div>
    </div>
    ${nodes}
  </div>`}
function bindMap(){
  document.getElementById("btn-back").onclick=()=>set({view:"landing",world:null});
  document.querySelectorAll("[data-n]").forEach(el=>el.addEventListener("click",()=>set({sub:el.dataset.n,filter:"all",showForm:false})));
}

// ── PANEL ──────────────────────────────────────────────────────
function renderPanel(){
  const w=WORLDS[S.world],p=w.p;
  const title=S.sub.charAt(0).toUpperCase()+S.sub.slice(1);
  const body=S.sub==="tasks"?renderTasks(p,w):S.sub==="content"?renderContent(p,w):renderHabits(p);
  return`<div class="screen fade-up" style="background:${p.bg};display:flex;flex-direction:column">
    <div style="padding:16px 18px 10px;border-bottom:.5px solid ${p.border};flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px">
        <button id="btn-back" class="nunito" style="border:.5px solid ${p.border};color:${p.dim};padding:5px 12px;border-radius:20px;font-size:10px;letter-spacing:2px">← MAP</button>
        <span class="cinzel" style="font-size:18px;color:${p.accent};letter-spacing:2px">${w.label}</span>
        <span class="corra" style="font-size:15px;color:${p.dim}">/ ${title}</span>
      </div>
    </div>
    <div class="panel-body">${body}</div>
  </div>`}

// ── TASKS ──────────────────────────────────────────────────────
function renderTasks(p,w){
  const all=wTasks();
  const vis=all.filter(t=>S.filter==="all"?true:S.filter==="active"?!t.done:t.done)
    .sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority]));
  const done=all.filter(t=>t.done).length;
  const pCol={high:"#C97070",medium:p.accent,low:p.dim};
  const filters=["all","active","done"].map(f=>`<button class="nunito tf" data-f="${f}" style="border:.5px solid ${p.border};border-radius:20px;padding:5px 14px;font-size:10px;letter-spacing:2px;background:${S.filter===f?p.pill:"transparent"};color:${S.filter===f?p.pillT:p.dim}">${f.toUpperCase()}</button>`).join("");
  const rows=vis.map(t=>`
    <div style="background:${p.card};border:.5px solid ${p.border};border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;opacity:${t.done?.45:1};margin-bottom:8px">
      <button class="chk-task" data-id="${t.id}" style="width:18px;height:18px;border-radius:4px;border:1.5px solid ${p.accent};background:${t.done?p.accent:"transparent"};color:#0a0812;font-size:11px;flex-shrink:0">${t.done?"✓":""}</button>
      <span class="nunito" style="flex:1;font-size:13px;color:${t.done?p.dim:p.pillT};text-decoration:${t.done?"line-through":"none"}">${t.title}</span>
      <span class="nunito" style="font-size:9px;color:${pCol[t.priority]};letter-spacing:1px">${t.priority}</span>
      ${t.due?`<span class="nunito" style="font-size:9px;color:${p.dim}">${t.due}</span>`:""}
      <button class="del-task" data-id="${t.id}" style="color:${p.dim};font-size:16px">×</button>
    </div>`).join("");
  return`
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">${filters}
      <span class="nunito" style="margin-left:auto;font-size:10px;color:${p.dim}">${done}/${all.length} done</span>
    </div>
    <div style="background:${p.card};border:1px solid ${p.border};border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="corra" style="font-size:13px;color:${p.dim};margin-bottom:10px">— new task</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="t-title" class="pill-in nunito" placeholder="task title…" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}"/>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="t-pri" class="pill-sel nunito" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}">
            ${["high","medium","low"].map(o=>`<option>${o}</option>`).join("")}
          </select>
          <input type="date" id="t-due" style="background:${p.pill};border:1px solid ${p.border};border-radius:20px;padding:8px 12px;font-size:11px;color:${p.pillT};outline:none;flex:1"/>
          <button id="btn-add-task" style="border:1px solid ${p.accent};color:${p.accent};border-radius:20px;padding:8px 18px;font-size:10px;letter-spacing:2px" class="nunito">ADD +</button>
        </div>
      </div>
    </div>
    ${vis.length===0?`<div class="corra" style="text-align:center;padding:2rem;color:${p.dim};font-size:17px">nothing here yet</div>`:""}
    ${rows}`}

// ── CONTENT ────────────────────────────────────────────────────
function renderContent(p,w){
  const posts=wPosts();
  const counts=STATUSES.map(s=>`<div style="text-align:center"><div class="cinzel" style="font-size:20px;color:${SCOL[s]}">${posts.filter(x=>x.status===s).length}</div><div class="nunito" style="font-size:8px;color:${p.dim};letter-spacing:1px">${s.replace("_"," ")}</div></div>`).join("");
  const form=S.showForm?`
    <div style="background:${p.card};border:1px solid ${p.border};border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="corra" style="font-size:13px;color:${p.dim};margin-bottom:10px">— new post</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="p-title" class="pill-in nunito" placeholder="post title / caption…" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}"/>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="p-client" class="pill-sel nunito" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}">${w.clients.map(c=>`<option>${c}</option>`).join("")}</select>
          <select id="p-type" class="pill-sel nunito" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}">${w.types.map(t=>`<option>${t}</option>`).join("")}</select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="date" id="p-date" style="background:${p.pill};border:1px solid ${p.border};border-radius:20px;padding:8px 12px;font-size:11px;color:${p.pillT};outline:none;flex:1"/>
          <select id="p-status" class="pill-sel nunito" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT}">${STATUSES.map(s=>`<option>${s}</option>`).join("")}</select>
        </div>
        <textarea id="p-notes" placeholder="notes, hook, caption…" rows="2" style="background:${p.pill};border:1px solid ${p.border};border-radius:10px;padding:8px 12px;font-size:12px;color:${p.pillT};resize:vertical;outline:none;font-family:'Cormorant Garamond',serif;font-style:italic"></textarea>
        <button id="btn-save-post" style="border:1px solid ${p.accent};color:${p.accent};border-radius:20px;padding:8px 18px;font-size:10px;letter-spacing:2px;align-self:flex-start" class="nunito">SAVE</button>
      </div>
    </div>`:"";
  const rows=posts.map(post=>`
    <div style="background:${p.card};border:.5px solid ${p.border};border-radius:10px;padding:10px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="nunito" style="flex:1;font-size:13px;color:${p.pillT}">${post.title}</span>
        <select class="st-sel nunito" data-id="${post.id}" style="background:transparent;border:.5px solid ${SCOL[post.status]};border-radius:20px;padding:3px 8px;font-size:9px;color:${SCOL[post.status]};outline:none;letter-spacing:1px">
          ${STATUSES.map(s=>`<option ${s===post.status?"selected":""}>${s}</option>`).join("")}
        </select>
        <button class="del-post nunito" data-id="${post.id}" style="color:${p.dim};font-size:16px">×</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${[post.client,post.type,post.date].filter(Boolean).map(v=>`<span class="nunito" style="font-size:9px;color:${p.dim}">${v}</span>`).join('<span style="color:'+p.dim+'">·</span>')}</div>
      ${post.notes?`<div class="corra" style="font-size:12px;color:${p.dim};margin-top:6px;line-height:1.6">${post.notes}</div>`:""}
    </div>`).join("");
  return`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="display:flex;gap:16px">${counts}</div>
      <button id="btn-toggle-form" class="nunito" style="border:1px solid ${p.accent};color:${p.accent};border-radius:20px;padding:7px 16px;font-size:10px;letter-spacing:2px">${S.showForm?"CANCEL":"+ POST"}</button>
    </div>
    ${form}
    ${posts.length===0&&!S.showForm?`<div class="corra" style="text-align:center;padding:2rem;color:${p.dim};font-size:17px">nothing scheduled yet</div>`:""}
    ${rows}`}

// ── HABITS ─────────────────────────────────────────────────────
function renderHabits(p){
  const habits=wHabits();
  const grid=habits.length===0?`<div class="corra" style="text-align:center;padding:2rem;color:${p.dim};font-size:17px">no habits tracked yet</div>`:`
    <div style="background:${p.card};border:1px solid ${p.border};border-radius:12px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr repeat(7,30px) 42px 24px;padding:8px 10px;border-bottom:.5px solid ${p.border}">
        <span class="nunito" style="font-size:8px;color:${p.dim};letter-spacing:2px">HABIT</span>
        ${DAYS.map(d=>`<span class="nunito" style="font-size:8px;color:${p.dim};text-align:center">${d}</span>`).join("")}
        <span class="nunito" style="font-size:8px;color:${p.dim};text-align:center">STK</span><span></span>
      </div>
      ${habits.map((h,i)=>{const s=hStreak(h.id);return`
        <div style="display:grid;grid-template-columns:1fr repeat(7,30px) 42px 24px;padding:10px 10px;border-bottom:${i<habits.length-1?".5px solid "+p.border:"none"};align-items:center">
          <span class="nunito" style="font-size:12px;color:${p.pillT};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h.name}</span>
          ${DAYS.map((_,di)=>{const c=hChecked(h.id,di);return`<div style="display:flex;justify-content:center"><button class="hchk" data-hid="${h.id}" data-off="${di}" style="width:20px;height:20px;border-radius:4px;background:${c?p.accent:"transparent"};border:1.5px solid ${c?p.accent:p.border};color:#0a0812;font-size:10px">${c?"✓":""}</button></div>`}).join("")}
          <div class="nunito" style="text-align:center;font-size:10px;color:${s>0?p.accent:p.dim}">${s>0?s+"d":"—"}</div>
          <button class="del-habit" data-id="${h.id}" style="color:${p.dim};font-size:14px">×</button>
        </div>`}).join("")}
    </div>`;
  return`
    <div style="background:${p.card};border:1px solid ${p.border};border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="corra" style="font-size:13px;color:${p.dim};margin-bottom:10px">— new habit</div>
      <div style="display:flex;gap:8px">
        <input id="h-name" class="pill-in nunito" placeholder="habit name…" style="background:${p.pill};border:1px solid ${p.border};color:${p.pillT};flex:1"/>
        <button id="btn-add-habit" class="nunito" style="border:1px solid ${p.accent};color:${p.accent};border-radius:20px;padding:8px 18px;font-size:10px;letter-spacing:2px">ADD +</button>
      </div>
    </div>
    ${grid}`}

// ── BIND PANEL ─────────────────────────────────────────────────
function bindPanel(){
  const w=WORLDS[S.world],p=w.p;
  document.getElementById("btn-back").onclick=()=>set({sub:null});

  if(S.sub==="tasks"){
    document.querySelectorAll(".tf").forEach(el=>el.onclick=()=>set({filter:el.dataset.f}));
    const go=()=>{
      const title=document.getElementById("t-title")?.value.trim();
      if(!title) return;
      mutTasks(t=>[...t,{id:uid(),title,priority:document.getElementById("t-pri").value,due:document.getElementById("t-due").value,done:false,created:toDay()}]);
    };
    document.getElementById("btn-add-task")?.addEventListener("click",go);
    document.getElementById("t-title")?.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    document.querySelectorAll(".chk-task").forEach(el=>el.onclick=()=>mutTasks(t=>t.map(x=>x.id===el.dataset.id?{...x,done:!x.done}:x)));
    document.querySelectorAll(".del-task").forEach(el=>el.onclick=()=>mutTasks(t=>t.filter(x=>x.id!==el.dataset.id)));
  }
  if(S.sub==="content"){
    document.getElementById("btn-toggle-form")?.addEventListener("click",()=>set({showForm:!S.showForm}));
    document.getElementById("btn-save-post")?.addEventListener("click",()=>{
      const title=document.getElementById("p-title")?.value.trim();
      if(!title) return;
      mutPosts(ps=>[...ps,{id:uid(),title,client:document.getElementById("p-client").value,type:document.getElementById("p-type").value,date:document.getElementById("p-date").value,status:document.getElementById("p-status").value,notes:document.getElementById("p-notes").value}]);
      set({showForm:false});
    });
    document.querySelectorAll(".st-sel").forEach(el=>el.onchange=()=>mutPosts(ps=>ps.map(x=>x.id===el.dataset.id?{...x,status:el.value}:x)));
    document.querySelectorAll(".del-post").forEach(el=>el.onclick=()=>mutPosts(ps=>ps.filter(x=>x.id!==el.dataset.id)));
  }
  if(S.sub==="habits"){
    const go=()=>{
      const n=document.getElementById("h-name")?.value.trim();
      if(!n) return;
      mutHabits(h=>[...h,{id:uid(),name:n}]);
    };
    document.getElementById("btn-add-habit")?.addEventListener("click",go);
    document.getElementById("h-name")?.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    document.querySelectorAll(".hchk").forEach(el=>el.onclick=()=>{
      const d=dayStr(+el.dataset.off),k=S.world+"_"+el.dataset.hid+"_"+d;
      const hl={...S.hlog};hl[k]=!hl[k];set({hlog:hl});
    });
    document.querySelectorAll(".del-habit").forEach(el=>el.onclick=()=>mutHabits(h=>h.filter(x=>x.id!==el.dataset.id)));
  }
}
function bindMap(){}

render();
</script>
